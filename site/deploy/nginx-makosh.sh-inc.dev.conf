# Owner-authorized public host (2026-11-20): the Makosh site and the read-status endpoint in LXC 136.
server {
 listen 80;
 listen [::]:80;
 server_name makosh.sh-inc.dev;
 location / { return 301 https://$host$request_uri; }
}
server {
 listen 443 ssl;
 listen [::]:443 ssl;
 server_name makosh.sh-inc.dev;
 ssl_certificate /etc/nginx/ssl/*.sh-inc.dev_sh-inc.dev_P384/fullchain.cer;
 ssl_certificate_key /etc/nginx/ssl/*.sh-inc.dev_sh-inc.dev_P384/private.key;
 server_tokens off;
 client_max_body_size 1k;
 client_body_timeout 10s;
 access_log /var/log/nginx/makosh_access.log;
 error_log /var/log/nginx/makosh_error.log;
 # Read-status images: who opened a message is not written to the access log.
 location /o/ {
  access_log off;
  error_log /dev/null crit;
  proxy_pass http://10.34.10.34:18760;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header Connection "";
  proxy_connect_timeout 3s;
  proxy_read_timeout 10s;
 }
 location / {
  proxy_pass http://10.34.10.34:18760;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header Connection "";
  proxy_connect_timeout 3s;
  proxy_read_timeout 15s;
 }
}
