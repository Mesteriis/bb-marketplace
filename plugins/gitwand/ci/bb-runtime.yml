# GitWand runtime for the Makosh GitWand plugin for BB.
#
# Lives in the release repository (Mesteriis/GitWand-bb, branch bb-runtime) as
# .github/workflows/bb-runtime.yml; the source of truth is
# plugins/gitwand/ci/bb-runtime.yml in Mesteriis/bb-marketplace.
#
# Builds the runtime archive per platform with plugins/gitwand/scripts/build-runtime.ts
# (upstream GitWand at the pinned commit plus the plugin's patches), then, in the
# protected `release` environment, writes channel.json, signs it with the owner's
# minisign key and publishes a GitHub release with the archives.
#
# Secrets (environment `release`): MINISIGN_SECRET_KEY (the key file's text),
# MINISIGN_PASSWORD. Variable: MINISIGN_PUBLIC_KEY (both lines of the public key).
name: GitWand runtime for BB

on:
  workflow_dispatch:
    inputs:
      gitwand_tag:
        description: GitWand release tag (vX.Y.Z), as in upstream.lock.json
        required: true
        default: v3.14.0
      gitwand_commit:
        description: Full commit of that tag, as in upstream.lock.json
        required: true
        default: 436b9684f096e8edd35b6a36e3b4d3af0fd7e084
      build:
        description: Plugin build number (the N of +bbN)
        required: true
        default: "1"
      min_plugin_version:
        description: Oldest plugin version that may install this build
        required: true
        default: 0.1.0
      marketplace_ref:
        description: Commit or branch of Mesteriis/bb-marketplace with the build scripts and patches
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: bb-runtime
  cancel-in-progress: false

jobs:
  build:
    name: build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-15
          - platform: darwin-x64
            runner: macos-15-intel
          - platform: linux-x64
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Check out the plugin's build scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Mesteriis/bb-marketplace
          ref: ${{ inputs.marketplace_ref }}
          path: marketplace
          persist-credentials: false

      - name: Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Rust stable
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Linux build dependencies of the tauri crate
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev

      - name: Build the runtime archive
        working-directory: marketplace/plugins/gitwand
        env:
          GITWAND_TAG: ${{ inputs.gitwand_tag }}
          GITWAND_COMMIT: ${{ inputs.gitwand_commit }}
          BUILD: ${{ inputs.build }}
          PLATFORM: ${{ matrix.platform }}
        run: node scripts/build-runtime.ts --tag "$GITWAND_TAG" --commit "$GITWAND_COMMIT" --platform "$PLATFORM" --build "$BUILD" --out "$RUNNER_TEMP/out"

      - name: Keep the archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-${{ matrix.platform }}
          path: ${{ runner.temp }}/out/gitwand-runtime-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    name: sign and publish
    needs: build
    runs-on: ubuntu-22.04
    environment: release
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - name: Check out the plugin's build scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Mesteriis/bb-marketplace
          ref: ${{ inputs.marketplace_ref }}
          path: marketplace
          persist-credentials: false

      - name: Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Plugin dependencies
        working-directory: marketplace/plugins/gitwand
        run: npm ci --no-audit --no-fund

      - name: Collect the archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: runtime-*
          path: archives
          merge-multiple: true

      - name: Write channel.json
        env:
          GITWAND_TAG: ${{ inputs.gitwand_tag }}
          GITWAND_COMMIT: ${{ inputs.gitwand_commit }}
          BUILD: ${{ inputs.build }}
          MIN_PLUGIN: ${{ inputs.min_plugin_version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          version="${GITWAND_TAG#v}+bb${BUILD}"
          tag="runtime-${GITWAND_TAG#v}-bb${BUILD}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          node marketplace/plugins/gitwand/scripts/make-channel.ts \
            --version "$version" --tag "$GITWAND_TAG" --commit "$GITWAND_COMMIT" \
            --min-plugin "$MIN_PLUGIN" \
            --base-url "https://github.com/$REPOSITORY/releases/download/$tag" \
            --out release archives/gitwand-runtime-*.tar.gz

      - name: Sign channel.json
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          MINISIGN_PUBLIC_KEY: ${{ vars.MINISIGN_PUBLIC_KEY }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign
          umask 077
          key="$RUNNER_TEMP/minisign.key"
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          printf '%s\n' "$MINISIGN_PUBLIC_KEY" > "$RUNNER_TEMP/minisign.pub"
          printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s "$key" -m release/channel.json -t "gitwand-bb runtime $VERSION"
          rm -f "$key"
          minisign -V -p "$RUNNER_TEMP/minisign.pub" -m release/channel.json

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GITWAND_COMMIT: ${{ inputs.gitwand_commit }}
        run: |
          gh release create "$RELEASE_TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "GitWand runtime $VERSION" \
            --notes "GitWand runtime $VERSION for the Makosh GitWand plugin for BB, built from devlint/GitWand at $GITWAND_COMMIT. Verify channel.json with channel.json.minisig and the plugin's public key."
