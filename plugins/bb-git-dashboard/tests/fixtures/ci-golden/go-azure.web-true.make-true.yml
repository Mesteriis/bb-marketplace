# Go CI from a Makosh Git template. Add deployment and secrets yourself.
trigger:
  branches:
    include: [main]
pool:
  vmImage: ubuntu-latest
steps:
  - task: GoTool@0
    inputs:
      version: "1.23"
  - task: NodeTool@0
    inputs:
      versionSpec: "24.x"
  - script: make check
    displayName: Check
