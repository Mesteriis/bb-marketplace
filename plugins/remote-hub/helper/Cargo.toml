[package]
name = "remote-hub-helper"
version = "0.1.0"
edition = "2021"
description = "Remote Hub supervision helper: owns PTY sessions and speaks the versioned stdio protocol."
license = "MIT"
publish = false

[features]
# Off by default: enables the --echo-command argv hook used only by the
# integration tests. The release binary (npm run build:helper) has it off.
test-hooks = []

[lib]
name = "remote_hub_helper"
path = "src/lib.rs"

[[bin]]
name = "remote-hub-helper"
path = "src/main.rs"

[[test]]
name = "echo"
path = "tests/echo.rs"
required-features = ["test-hooks"]

[[test]]
name = "production"
path = "tests/production.rs"

[[test]]
name = "rdp_process"
path = "tests/rdp_process.rs"
required-features = ["test-hooks"]

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# IronRDP, pinned per docs/rdp-engine.md. Each crate moves at its own pace, so
# the exact versions below are the coherent set verified against crates.io.
ironrdp-connector = "=0.12.0"
ironrdp-tokio = "=0.12.0"
ironrdp-tls = { version = "=0.3.0", features = ["rustls-ring"] }
ironrdp-session = "=0.13.0"
ironrdp-pdu = "=0.11.0"
ironrdp-graphics = "=0.11.0"
ironrdp-input = "=0.9.0"
ironrdp-core = "=0.3.1"

tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
x509-cert = { version = "0.3", default-features = false, features = ["std"] }
sha2 = "0.11"
png = "0.18"

[dev-dependencies]
# Test-only: a fake RDP server that presents the fixture certificates, and a
# client that trusts the fixture CA (the validated-certificate path).
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring"] }
