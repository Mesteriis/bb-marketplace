[package]
name = "remote-hub-helper"
version = "0.1.0"
edition = "2021"
description = "Remote Hub supervision helper: owns PTY sessions and speaks the versioned stdio protocol."
license = "MIT"
publish = false

[lib]
name = "remote_hub_helper"
path = "src/lib.rs"

[[bin]]
name = "remote-hub-helper"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
