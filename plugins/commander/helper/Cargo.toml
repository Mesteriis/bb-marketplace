[package]
name = "commander-archive-helper"
version = "0.1.0"
edition = "2021"
publish = false
description = "Archive reader/writer helper for BB Commander (ZIP/TAR, macOS arm64)"

[[bin]]
name = "commander-archive-helper"
path = "src/main.rs"

[lib]
name = "archive_helper"
path = "src/lib.rs"

[features]
# Test-only hooks (counters, memory balloon). Never part of a release build.
test-hooks = []

[dependencies]
libc = "=0.2.191"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
base64 = "=0.22.1"
zeroize = "=1.9.2"
sha2 = "=0.10.9"
zip = { version = "=8.6.0", default-features = false, features = ["deflate", "aes-crypto"] }
tar = { version = "=0.4.46", default-features = false }

[dev-dependencies]
flate2 = "=1.1.11"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
